name: Architecture tests

on:
  pull_request:
    paths:
      - "core/**"
      - "observability/**"
      - "gateway/**"
      - "voice/**"
      - "supervisor/**"
      - "eval_router/**"
      - "mcp/**"
      - "tests/core/**"
      - "tests/observability/**"
      - "tests/gateway/**"
      - "tests/voice/**"
      - "tests/supervisor/**"
      - "tests/eval_router/**"
      - "tests/mcp/**"
      - "tests/host_agent/**"
      - "scripts/host_agent.py"
      - "scripts/env_utils.py"
      - "scripts/ai.ps1"
      - "scripts/test-turn-proxy.ps1"
      - "scripts/turn_proxy_acceptance_probe.py"
      - "voice/turn_proxy/Dockerfile.coturn"
      - "dashboard/**"
      - "config/models.json"
      - "compose.yaml"
      - ".github/workflows/architecture-tests.yml"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "observability/**"
      - "gateway/**"
      - "voice/**"
      - "supervisor/**"
      - "eval_router/**"
      - "mcp/**"
      - "tests/core/**"
      - "tests/observability/**"
      - "tests/gateway/**"
      - "tests/voice/**"
      - "tests/supervisor/**"
      - "tests/eval_router/**"
      - "tests/mcp/**"
      - "tests/host_agent/**"
      - "scripts/host_agent.py"
      - "scripts/env_utils.py"
      - "scripts/ai.ps1"
      - "scripts/test-turn-proxy.ps1"
      - "scripts/turn_proxy_acceptance_probe.py"
      - "voice/turn_proxy/Dockerfile.coturn"
      - "dashboard/**"
      - ".github/workflows/architecture-tests.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            gateway/requirements.txt
            voice/requirements.txt
            supervisor/requirements.txt
            eval_router/requirements.txt
            mcp/requirements.txt

      - name: Install service test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install             -r gateway/requirements.txt             -r voice/requirements.txt             -r supervisor/requirements.txt             -r eval_router/requirements.txt             -r mcp/requirements.txt

      - name: Compile architecture packages
        run: python -m compileall -q core observability gateway voice supervisor eval_router mcp scripts/host_agent.py tests/host_agent

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Core tests
        run: python -m unittest discover -s tests/core -v

      - name: Observability tests
        run: python -m unittest discover -s tests/observability -v

      - name: Gateway tests
        run: python -m unittest discover -s tests/gateway -v

      - name: Voice tests
        run: python -m unittest discover -s tests/voice -v

      - name: Supervisor tests
        run: python -m unittest discover -s tests/supervisor -v

      - name: Evaluation router tests
        env:
          EVAL_ROUTER_DB: /tmp/ai-stack-eval-router-ci.sqlite3
        run: python -m unittest discover -s tests/eval_router -v

      - name: MCP tests
        run: python -m unittest discover -s tests/mcp -v

      - name: Host-agent tests
        run: python -m unittest discover -s tests/host_agent -v

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard dependencies
        run: npm ci --prefix dashboard

      - name: Dashboard Vitest
        run: npm --prefix dashboard run test -- --run

      - name: Dashboard lint
        run: npm --prefix dashboard run lint

      - name: Dashboard build
        run: npm --prefix dashboard run build

  powershell-handoff:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exercise the Windows PowerShell to Python probe handoff
        shell: powershell
        run: python -m unittest tests.voice.test_turn_proxy.TurnProxyTests.test_acceptance_probe_runs_through_the_real_powershell_python_handoff -v
