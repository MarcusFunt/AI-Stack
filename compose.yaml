name: ai-stack

x-gpu-base: &gpu-base
  profiles: ["gpu"]
  gpus: all
  restart: "no"
  networks: [ai]
  init: true
  stop_grace_period: 30s

services:
  docker-control:
    build:
      context: ./docker-control
      args:
        SOURCE_HASH: ${AI_STACK_DOCKER_CONTROL_SOURCE_HASH:-unknown}
    container_name: ai-stack-docker-control
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      CONFIG_PATH: /config/models.json
      DOCKER_CONTROL_TOKEN: ${SUPERVISOR_TOKEN}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/config:ro
    networks: [docker-control]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  supervisor:
    build:
      context: ./supervisor
      args:
        SOURCE_HASH: ${AI_STACK_SUPERVISOR_SOURCE_HASH:-unknown}
    container_name: ai-stack-supervisor
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      CONFIG_PATH: /config/models.json
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN}
      LLAMA_API_KEY: ${LLAMA_API_KEY}
      LEASE_STATE_PATH: /state/supervisor-leases.json
      RUNTIME_SETTINGS_PATH: /state/runtime-settings.json
      SERVICE_METRICS_PATH: /state/supervisor-metrics.json
      DOCKER_CONTROL_URL: http://docker-control:8000
      DOCKER_CONTROL_TOKEN: ${SUPERVISOR_TOKEN}
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      docker-control:
        condition: service_healthy
    volumes:
      - ./config:/config:ro
      - ./data/state:/state
    networks: [ai, docker-control]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  telemetry:
    build:
      context: ./telemetry
      args:
        SOURCE_HASH: ${AI_STACK_TELEMETRY_SOURCE_HASH:-unknown}
    container_name: ai-stack-telemetry
    restart: unless-stopped
    init: true
    gpus: all
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TELEMETRY_INTERVAL: "1.0"
      TELEMETRY_DISK_PATH: /workspace
      TELEMETRY_HISTORY_DB: /state/telemetry-history.sqlite3
      TELEMETRY_PERSIST_INTERVAL: "60"
      TELEMETRY_HISTORY_RETENTION_SECONDS: "604800"
    volumes:
      - ./models:/workspace:ro
      - ./data/state:/state
    networks: [ai]
    healthcheck:
      test: ["CMD","python3","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ./gateway
      args:
        SOURCE_HASH: ${AI_STACK_GATEWAY_SOURCE_HASH:-unknown}
    container_name: ai-stack-gateway
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      AI_API_KEY: ${AI_API_KEY}
      SUPERVISOR_URL: http://supervisor:8000
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN}
      LLAMA_API_KEY: ${LLAMA_API_KEY}
      CONFIG_PATH: /config/models.json
      TELEMETRY_URL: http://telemetry:8000
      RUNTIME_SETTINGS_PATH: /state/runtime-settings.json
      HOST_AGENT_URL: http://host.docker.internal:8788
      HOST_AGENT_TOKEN: ${HOST_AGENT_TOKEN}
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      supervisor:
        condition: service_healthy
      telemetry:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8090}:8000"
    volumes:
      - ./config:/config:ro
      - ./data/state:/state:ro
    networks: [ai]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 6

  dashboard:
    build:
      context: ./dashboard
      args:
        SOURCE_HASH: ${AI_STACK_DASHBOARD_SOURCE_HASH:-unknown}
    container_name: ai-stack-dashboard
    restart: unless-stopped
    init: true
    environment:
      AI_API_KEY: ${AI_API_KEY}
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:80"
    networks: [ai]
    healthcheck:
      test: ["CMD-SHELL","wget -q -O - http://127.0.0.1/api/health | grep -q '\"service\":\"gateway\"'"]
      interval: 10s
      timeout: 4s
      retries: 6

  mcp:
    build:
      context: ./mcp
      args:
        SOURCE_HASH: ${AI_STACK_MCP_SOURCE_HASH:-unknown}
    container_name: ai-stack-mcp
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      MCP_API_KEY: ${MCP_API_KEY}
      MCP_URL_TOKEN: ${MCP_URL_TOKEN}
      AI_API_KEY: ${AI_API_KEY}
      GATEWAY_URL: http://gateway:8000
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MCP_PORT:-8765}:8000"
    networks: [ai]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 6

  agent-lab-sandbox:
    image: ai-stack-agent-lab:latest
    container_name: ai-stack-agent-lab-sandbox
    restart: unless-stopped
    init: true
    read_only: true
    network_mode: "none"
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    environment:
      AGENT_LAB_RUNS_ROOT: /runs
      AGENT_LAB_JOBS_ROOT: /jobs
    volumes:
      - ./data/agent-lab/runs:/runs:ro
      - ./data/agent-lab/sandbox:/jobs
    command: ["python", "-m", "agent_lab.sandbox"]
    healthcheck:
      test: ["CMD","python","-c","import json,time,pathlib; p=json.loads(pathlib.Path('/jobs/heartbeat.json').read_text()); assert time.time()-float(p['ts']) < 5"]
      interval: 5s
      timeout: 3s
      retries: 6

  agent-lab:
    build:
      context: ./agent_lab
      args:
        SOURCE_HASH: ${AI_STACK_AGENT_LAB_SOURCE_HASH:-unknown}
    container_name: ai-stack-agent-lab
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      AGENT_LAB_SOURCE_REPO: /source.git
      AGENT_LAB_DATA_ROOT: /data
      AGENT_LAB_DB: /data/agent-lab.sqlite3
      AGENT_LAB_MODEL: local-fast
      AGENT_LAB_MAX_WORKERS: "1"
      GATEWAY_URL: http://gateway:8000
      AI_API_KEY: ${AI_API_KEY}
    depends_on:
      gateway:
        condition: service_healthy
      agent-lab-sandbox:
        condition: service_healthy
    volumes:
      - ./.git:/source.git:ro
      - ./data/agent-lab:/data
    ports:
      - "127.0.0.1:${AGENT_LAB_PORT:-8770}:8000"
    networks: [ai]
    healthcheck:
      test: ["CMD","python","-c","import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)); assert d.get('status') == 'ok' and d.get('sandbox') == 'ok'"]
      interval: 10s
      timeout: 4s
      retries: 6

  llm:
    <<: *gpu-base
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: ai-stack-llm
    volumes:
      - ./models/llm:/models:ro
    command:
      - -m
      - ${LLM_MODEL:-/models/daily.gguf}
      - --alias
      - local-fast
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - ${LLM_CONTEXT:-32768}
      - -np
      - "1"
      - -ngl
      - ${LLM_GPU_LAYERS:-999}
      - --api-key
      - ${LLAMA_API_KEY}
      - --cors-origins
      - localhost

  reasoning:
    <<: *gpu-base
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: ai-stack-reasoning
    volumes:
      - ./models/llm:/models:ro
    command:
      - -m
      - ${REASONING_MODEL:-/models/reasoning.gguf}
      - --alias
      - local-reasoning
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - ${REASONING_CONTEXT:-8192}
      - -np
      - "1"
      - -ngl
      - ${REASONING_GPU_LAYERS:-28}
      - --api-key
      - ${LLAMA_API_KEY}
      - --cors-origins
      - localhost
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 420s

  stt:
    <<: *gpu-base
    build:
      context: ./stt
      args:
        SOURCE_HASH: ${AI_STACK_STT_SOURCE_HASH:-unknown}
    container_name: ai-stack-stt
    environment:
      STT_MODEL: ${STT_MODEL:-large-v3}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-float16}
      STT_DOWNLOAD_ROOT: /models
      HF_HOME: ${HF_HOME:-/cache/huggingface}
    volumes:
      - ./models/stt:/models
      - ./data/cache:/cache

  tts:
    <<: *gpu-base
    image: local/qwen3-tts-openai:0.1.1
    container_name: ai-stack-tts
    environment:
      QWEN_MODEL_ID: ${TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-1.7B-Base}
      QWEN_ATTN_IMPLEMENTATION: sdpa
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      HF_HOME: /data/hf
    volumes:
      - qwen_tts_hf_cache:/data/hf
      - ./models/tts:/models:ro

  vlm:
    <<: *gpu-base
    build:
      context: ./vlm
      args:
        SOURCE_HASH: ${AI_STACK_VLM_SOURCE_HASH:-unknown}
    container_name: ai-stack-vlm
    environment:
      VLM_MODEL: ${VLM_MODEL:-Qwen/Qwen3-VL-4B-Instruct}
      VLM_LOCAL_FILES_ONLY: "1"
      HF_HOME: ${HF_HOME:-/cache/huggingface}
    volumes:
      - ./models/vlm:/models
      - ./data/cache:/cache
    shm_size: "2gb"

  comfyui:
    <<: *gpu-base
    build:
      context: ./third_party/ComfyUI
      dockerfile: Dockerfile.ai-stack
    container_name: ai-stack-comfyui
    ports:
      - "127.0.0.1:8188:8188"
    volumes:
      - ./models/image/checkpoints:/opt/ComfyUI/models/checkpoints
      - ./models/image/diffusion_models:/opt/ComfyUI/models/diffusion_models
      - ./models/image/vae:/opt/ComfyUI/models/vae
      - ./models/image/loras:/opt/ComfyUI/models/loras
      - ./models/image/controlnet:/opt/ComfyUI/models/controlnet
      - ./models/image/clip:/opt/ComfyUI/models/clip
      - ./models/image/text_encoders:/opt/ComfyUI/models/text_encoders
      - ./models/image/upscale_models:/opt/ComfyUI/models/upscale_models
      - ./data/input/comfyui:/opt/ComfyUI/input
      - ./data/outputs/comfyui:/opt/ComfyUI/output
      - ./data/cache:/cache

  wangp:
    <<: *gpu-base
    build:
      context: ./third_party/Wan2GP
      args:
        CUDA_ARCHITECTURES: "8.6"
    container_name: ai-stack-wangp
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - ./third_party/Wan2GP:/workspace
      - ./models/wangp:/models/wangp
      - ./data/cache:/home/user/.cache
      - ./data/outputs/wangp:/workspace/outputs
    command:
      - --profile
      - "4"
      - --attention
      - sage
      - --perc-reserved-mem-max
      - "1"
    shm_size: "2gb"

  lerobot:
    <<: *gpu-base
    image: huggingface/lerobot-gpu:latest
    container_name: ai-stack-lerobot
    command: ["sleep", "infinity"]
    volumes:
      - ./data/cache:/home/user_lerobot/.cache
    shm_size: "2gb"

networks:
  ai:
    name: ai-stack-net
  docker-control:
    name: ai-stack-docker-control-net
    internal: true

volumes:
  qwen_tts_hf_cache:
    external: true
